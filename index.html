<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoTrace — Sustainable Supply Chain Tracker</title>
  <meta name="description" content="EcoTrace helps small businesses track sourcing, suppliers, materials and sustainability for every product, and share it with customers.">
  <meta name="theme-color" content="#123329">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b6b4e'/%3E%3Cpath d='M10 21c0-5.4 3.4-9 9-9.4 0 5.6-3.2 9.4-9 9.4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ecotrace.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      try {
        // Returning, already-onboarded users skip the login screen with no flash.
        if (localStorage.getItem('ecotrace.account')) document.documentElement.classList.add('ecotrace-authed');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Logo glyph: leaf inside circular arrows, with two supply-chain nodes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="logo-mark" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 15a9.5 9.5 0 0 1 16.2-6.2"/>
        <path d="M23 4.5v4.8h-4.8"/>
        <path d="M25.5 17a9.5 9.5 0 0 1-16.2 6.2"/>
        <path d="M9 27.5v-4.8h4.8"/>
        <path d="M12.5 19.5l3.5-3.5"/>
      </g>
      <path d="M12.5 19.5c0-4.2 2.6-7 7-7.3 0 4.3-2.4 7.3-7 7.3z" fill="currentColor"/>
      <circle cx="6.5" cy="15" r="1.9" fill="currentColor"/>
      <circle cx="25.5" cy="17" r="1.9" fill="currentColor"/>
    </symbol>
  </svg>

  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Phone + OTP sign-in and business onboarding (auth.js). Hidden entirely
       once html.ecotrace-authed is set, either pre-paint (returning users)
       or on successful sign-in. -->
  <div id="authRoot" hidden></div>

  <div class="app" id="app">

    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/dashboard" aria-label="EcoTrace home">
        <span class="brand__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#logo-mark"/></svg></span>
        <span class="brand__text">
          <strong>EcoTrace</strong>
          <small data-i18n="brand.tagline">Sustainable Supply Chain Tracker</small>
        </span>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a class="nav__link" href="#/dashboard" data-page="dashboard" title="Dashboard">
          <i data-lucide="layout-dashboard" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a class="nav__link" href="#/products" data-page="products" title="Products">
          <i data-lucide="package" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.products">Products</span>
          <span class="nav__count" id="navProductCount"></span>
        </a>
        <a class="nav__link" href="#/suppliers" data-page="suppliers" title="Suppliers">
          <i data-lucide="handshake" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.suppliers">Suppliers</span>
          <span class="nav__count" id="navSupplierCount"></span>
        </a>
        <a class="nav__link" href="#/materials" data-page="materials" title="Materials">
          <i data-lucide="layers" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.materials">Materials</span>
        </a>
        <a class="nav__link" href="#/sustainability" data-page="sustainability" title="Sustainability">
          <i data-lucide="sprout" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.sustainability">Sustainability</span>
        </a>

        <a class="nav__link" href="#/vendors" data-page="vendors" title="Vendor Discovery">
          <i data-lucide="search" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.vendors">Vendor Discovery</span>
        </a>

        <a class="nav__link" href="#/consumer" data-page="consumer" title="Consumer View">
          <i data-lucide="qr-code" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.consumer">Consumer View</span>
        </a>


        <a class="nav__link" href="#/settings" data-page="settings" title="Settings">
          <i data-lucide="settings" aria-hidden="true"></i><span class="nav__label" data-i18n="nav.settings">Settings</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <a class="profile" href="#/settings" title="Business settings">
          <span class="avatar" data-business-initials>GL</span>
          <span class="profile__text">
            <strong data-business-name>GreenLeaf Co.</strong>
            <small>Business account</small>
          </span>
        </a>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-action="close-sidebar"></div>

    <!-- ============ Main shell ============ -->
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" data-action="toggle-sidebar" aria-label="Open navigation" data-i18n-aria-label="topbar.menu_toggle" aria-expanded="false" aria-controls="sidebar">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>

        <div class="topbar__title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageDesc">Your supply chain at a glance</p>
        </div>

        <div class="topbar__actions">
          <!-- Global search -->
          <div class="dropdown-host">
            <button class="icon-btn" type="button" id="searchToggle" data-action="toggle-dropdown" aria-controls="searchPanel" aria-expanded="false" aria-label="Search products, suppliers and materials" data-i18n-aria-label="topbar.search_aria" title="Search (Ctrl K)">
              <i data-lucide="search" aria-hidden="true"></i>
            </button>
            <div class="dropdown dropdown--search" id="searchPanel">
              <div class="search-field">
                <i data-lucide="search" aria-hidden="true"></i>
                <input id="globalSearch" type="search" placeholder="Search products, suppliers, materials" data-i18n-placeholder="topbar.search_placeholder" autocomplete="off" aria-label="Search" aria-controls="searchResults" aria-expanded="false" role="combobox" aria-autocomplete="list">
                <kbd>Esc</kbd>
              </div>
              <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
            </div>
          </div>

          <!-- Language toggle (English / हिन्दी) -->
          <button class="icon-btn lang-btn" type="button" id="langToggle" aria-label="Switch language" data-i18n-aria-label="topbar.lang_toggle" title="English / हिन्दी">EN</button>

          <button class="icon-btn" type="button" id="themeToggle" data-action="toggle-theme" aria-label="Switch to dark mode" title="Toggle theme"></button>

          <!-- Notifications -->
          <div class="dropdown-host">
            <button class="icon-btn" type="button" id="notifToggle" data-action="toggle-dropdown" aria-controls="notifPanel" aria-expanded="false" aria-label="Notifications" data-i18n-aria-label="topbar.notifications">
              <i data-lucide="bell" aria-hidden="true"></i>
              <span class="dot-badge" id="notifBadge" hidden>0</span>
            </button>
            <div class="dropdown dropdown--notif" id="notifPanel"></div>
          </div>

          <!-- Business profile -->
          <div class="dropdown-host">
            <button class="profile-btn" type="button" data-action="toggle-dropdown" aria-controls="profilePanel" aria-expanded="false" aria-label="Business menu">
              <span class="avatar avatar--sm" data-business-initials>GL</span>
              <span class="profile-btn__name" data-business-name>GreenLeaf Co.</span>
              <i data-lucide="chevron-down" aria-hidden="true"></i>
            </button>
            <div class="dropdown dropdown--menu" id="profilePanel">
              <a class="menu-item" href="#/settings"><i data-lucide="settings" aria-hidden="true"></i><span data-i18n="topbar.menu_business_settings">Business settings</span></a>
              <a class="menu-item" href="#/consumer"><i data-lucide="qr-code" aria-hidden="true"></i><span data-i18n="topbar.menu_consumer_view">Consumer view</span></a>
              <button class="menu-item" type="button" data-action="toggle-theme"><i data-lucide="moon" aria-hidden="true"></i><span data-i18n="topbar.menu_switch_theme">Switch theme</span></button>
              <div class="menu-sep"></div>
              <button class="menu-item" type="button" data-action="export-data"><i data-lucide="download" aria-hidden="true"></i><span data-i18n="topbar.menu_export">Export data</span></button>
            </div>
          </div>
        </div>
      </header>

      <main class="main" id="main" tabindex="-1">
        <section class="page" id="page-dashboard" data-page="dashboard" aria-label="Dashboard" hidden></section>
        <section class="page" id="page-products" data-page="products" aria-label="Products" hidden></section>
        <section class="page" id="page-suppliers" data-page="suppliers" aria-label="Suppliers" hidden></section>
        <section class="page" id="page-materials" data-page="materials" aria-label="Materials" hidden></section>
        <section class="page" id="page-sustainability" data-page="sustainability" aria-label="Sustainability" hidden></section>
        <section class="page" id="page-vendors" data-page="vendors" aria-label="Vendor Discovery" hidden></section>
        <section class="page" id="page-consumer" data-page="consumer" aria-label="Consumer view" hidden></section>
        <section class="page" id="page-settings" data-page="settings" aria-label="Settings" hidden></section>
      </main>
    </div>
  </div>

  <button class="preview-exit" id="previewExit" type="button" data-action="exit-preview" hidden>
    <i data-lucide="x" aria-hidden="true"></i>Exit preview
  </button>

  <div id="modalRoot"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

  <script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <!-- Additive modules: i18n dictionary + vendor discovery data must be
       ready before script.js's router calls into them; auth.js runs last
       so it can safely extend the already-defined app (state, renderSettings). -->
  <script src="i18n.js" defer></script>
  <script src="vendorData.js" defer></script>
  <script src="script.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
